name: CD_dags_changes_Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'orchestration/dags/**'
    
jobs:
  Upload-to-S3:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'    
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up AWS CLI
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Upload orchestration folder to S3
        run: |
          aws s3 sync orchestration/dags/ s3://cloud-platform-airflow/dags/

      - name: Get EC2 instance ID from SSM Parameter
        id: get_instance_id
        run: |
          INSTANCE_ID=$(aws ssm get-parameter --name "instance_1_id" --query "Parameter.Value" --output text)
          echo "INSTANCE_ID=$INSTANCE_ID" >> $GITHUB_ENV

      - name: Sync DAGs to EC2 via SSM
        run: |
          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Sync DAGs from S3 to EC2" \
            --parameters commands="aws s3 sync s3://cloud-platform-airflow/dags/ /home/ubuntu/airflow/dags/" \
            --timeout-seconds 600
